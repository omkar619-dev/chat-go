<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chat-go</title>
  <style>
    /* ──────────────────────────────────────────────────────────────────────
       Everything is in this file, on purpose. No CDN for a CSS framework and
       no build step: this app is served over a tailnet, and a stylesheet
       fetched from the public internet would mean it renders wrong on exactly
       the private network it is meant for. //go:embed puts the whole page in
       the binary, and that should stay true of how it looks.
       ────────────────────────────────────────────────────────────────────── */

    :root {
      --bg:        #f6f7f9;
      --surface:   #ffffff;
      --surface-2: #f1f3f5;
      --border:    #e3e6ea;
      --text:      #16181d;
      --text-dim:  #6b7280;
      --text-faint:#9aa1ab;
      --accent:    #4f46e5;
      --accent-2:  #6366f1;
      --accent-bg: #eef2ff;
      --green:     #15a34a;
      --amber:     #d97706;
      --amber-bg:  #fffbeb;
      --red:       #dc2626;
      --red-bg:    #fef2f2;
      --radius:    10px;
      --shadow:    0 1px 2px rgb(16 24 40 / 6%), 0 1px 3px rgb(16 24 40 / 4%);
    }

    /* Follows the operating system. No toggle, because a toggle is a setting to
       store, sync and get wrong, and the OS already knows the answer. */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #0f1115;
        --surface:   #171a21;
        --surface-2: #1e222b;
        --border:    #2a2f3a;
        --text:      #e7e9ee;
        --text-dim:  #9aa1ab;
        --text-faint:#6b7280;
        --accent:    #6366f1;
        --accent-2:  #818cf8;
        --accent-bg: #1e1b3a;
        --green:     #22c55e;
        --amber:     #f59e0b;
        --amber-bg:  #2a2010;
        --red:       #f87171;
        --red-bg:    #2a1516;
        --shadow:    0 1px 2px rgb(0 0 0 / 40%);
      }
    }

    * { box-sizing: border-box; }

    /* `hidden` is ONLY a rule in the browser's default stylesheet —
       `[hidden] { display: none }` — so any author rule that sets display outranks
       it. `#ringing { display: flex }` below did exactly that, and the result was an
       Accept/Reject bar permanently on screen with no call in progress, while the
       script was setting .hidden correctly the whole time. The attribute was right;
       it just had no authority. This gives it some.

       NOTE THE CONSEQUENCE: !important also beats an inline style, so an element
       revealed with `el.style.display = ...` must NEVER carry the hidden attribute —
       it could not be un-hidden. The split in this file is deliberate:
         .hidden        → #ringing, #callarea
         style.display  → #chat, #login, #summary
       Pick one per element. Mixing them is how this bug happens in reverse. */
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      /* dvh, not vh: on mobile the address bar changes the viewport height, and
         vh would leave the composer hidden behind it. */
      min-height: 100dvh;
    }

    input, textarea, select {
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border-color .12s, box-shadow .12s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
    input::placeholder { color: var(--text-faint); }

    button {
      padding: 0.6rem 0.95rem;
      border: 0;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 500;
      transition: filter .12s, transform .04s;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px); }

    .row { display: flex; gap: 0.5rem; }

    /* ── Login ─────────────────────────────────────────────────────────────── */
    #login {
      max-width: 340px;
      margin: 14vh auto;
      padding: 1.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    #login .brand { font-size: 1.4rem; font-weight: 650; letter-spacing: -0.02em; margin-bottom: 0.25rem; }
    #login .tagline { color: var(--text-dim); font-size: 0.88rem; margin-bottom: 1.25rem; }
    #login input { width: 100%; margin-bottom: 0.6rem; }
    #login button { width: 100%; margin-top: 0.3rem; }
    #error { color: var(--red); font-size: 0.88rem; margin: 0.75rem 0 0; min-height: 1.2em; }

    /* ── App shell ─────────────────────────────────────────────────────────── */
    /* The grid lives on #shell, NOT on #chat. The script toggles #chat with an
       inline style.display, and an inline style would override a grid declared
       here — so the container that is toggled and the container that lays out
       are deliberately two different elements. */
    #shell {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100dvh;
    }

    #sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      padding: 1rem;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }
    #sidebar .brand { font-size: 1.15rem; font-weight: 650; letter-spacing: -0.02em; }
    .side-label {
      color: var(--text-faint);
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      font-weight: 600;
      margin-bottom: 0.45rem;
    }

    /* Rooms are a vertical list now, not a row of pills — a sidebar scales to
       twenty rooms, a horizontal strip does not. */
    #rooms { display: flex; flex-direction: column; gap: 0.15rem; }
    #rooms button {
      background: transparent;
      color: var(--text-dim);
      text-align: left;
      padding: 0.45rem 0.6rem;
      font-weight: 500;
      border-radius: 8px;
    }
    #rooms button::before { content: "# "; color: var(--text-faint); }
    #rooms button:hover { background: var(--surface-2); color: var(--text); filter: none; }
    #rooms button.current { background: var(--accent); color: #fff; }
    #rooms button.current::before { color: rgb(255 255 255 / 60%); }
    /* A room you have NOT joined looks different, because clicking it joins you.
       Dashed, so the difference survives being colour-blind. */
    #rooms button.guest { border: 1px dashed var(--border); color: var(--text-faint); }

    #newroom input { flex: 1; min-width: 0; font-size: 0.85rem; padding: 0.4rem 0.55rem; }
    #newroom button { background: var(--green); padding: 0.4rem 0.7rem; font-size: 0.85rem; }

    #onlinenames { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.9rem; }
    #onlinenames .person { display: flex; align-items: center; gap: 0.4rem; white-space: nowrap; }
    /* The green dot is the status; the name is just a name. Putting the state in
       a separate element means a name can never be mistaken for a state. */
    #onlinenames .person::before {
      content: ""; width: 7px; height: 7px; border-radius: 50%;
      background: var(--green); flex: none;
    }
    #onlinenames .empty { color: var(--text-faint); font-size: 0.85rem; }
    .callbtn {
      background: var(--green); padding: 0.1rem 0.45rem;
      font-size: 0.7rem; border-radius: 6px;
    }

    #sidebar .spacer { flex: 1; }
    #relaytoggle {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.78rem; color: var(--text-dim);
    }
    #signout { background: var(--surface-2); color: var(--text-dim); font-size: 0.85rem; }

    /* ── Main column ───────────────────────────────────────────────────────── */
    #main {
      display: grid;
      /* header / scrolling middle / composer. `1fr` on the middle row plus
         min-height:0 is what lets it scroll instead of pushing the composer off
         the bottom of the screen — a grid item's default min-height is auto,
         which means "as tall as my content". */
      grid-template-rows: auto 1fr auto;
      min-height: 0;
    }
    #topbar {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    #roomtitle { font-weight: 600; font-size: 1rem; }
    #roomtitle::before { content: "# "; color: var(--text-faint); }
    #topbar .grow { flex: 1; }
    #topbar input { font-size: 0.85rem; padding: 0.4rem 0.6rem; width: 230px; }
    #topbar button { font-size: 0.85rem; padding: 0.4rem 0.7rem; }

    #scroll { overflow-y: auto; min-height: 0; padding: 1.1rem 1.25rem; }

    /* ── Messages ──────────────────────────────────────────────────────────── */
    #messages { display: flex; flex-direction: column; gap: 0.5rem; }
    .msg {
      max-width: min(70%, 560px);
      padding: 0.5rem 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px 12px 12px 4px;
      box-shadow: var(--shadow);
      line-height: 1.45;
      overflow-wrap: anywhere;   /* a 400-character word must not widen the page */
    }
    /* Your own messages sit on the right and carry the accent. This is the one
       piece of chrome that makes a transcript readable at a glance — without it
       you read every line to work out who said it. */
    .msg.own {
      margin-left: auto;
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      border-radius: 12px 12px 4px 12px;
    }
    .msg .meta {
      display: flex; align-items: baseline; gap: 0.5rem;
      margin-bottom: 0.15rem;
    }
    .msg b { color: var(--accent-2); font-size: 0.82rem; font-weight: 600; }
    .msg.own b { color: rgb(255 255 255 / 85%); }
    .msg .time {
      color: var(--text-faint); font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
    }
    .msg.own .time { color: rgb(255 255 255 / 60%); }

    /* ── Composer ──────────────────────────────────────────────────────────── */
    #composer {
      display: flex; gap: 0.5rem;
      padding: 0.85rem 1.25rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    #input { flex: 1; }
    #catchup { background: var(--surface-2); color: var(--text-dim); }

    /* ── Panels: summary, errors, search results ───────────────────────────── */
    #summary {
      display: none; margin-bottom: 0.9rem;
      padding: 0.7rem 0.9rem; line-height: 1.55;
      background: var(--accent-bg); border-left: 3px solid var(--accent);
      border-radius: 8px; white-space: pre-wrap;
    }
    #summary.waiting { color: var(--text-dim); font-style: italic; }
    /* An error must not look like a summary. Same panel, unmistakably different —
       colour AND weight, so it still reads as wrong in greyscale. */
    #summary.error {
      background: var(--red-bg); border-left-color: var(--red);
      color: var(--red); font-weight: 500;
    }

    #results { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.9rem; }
    .hit {
      display: flex; align-items: baseline; gap: 0.6rem;
      padding: 0.5rem 0.7rem;
      background: var(--surface-2); border-left: 3px solid var(--accent);
      border-radius: 8px; line-height: 1.45;
    }
    .hit b { color: var(--accent-2); }
    .hit .score {
      margin-left: auto; flex: none;
      color: var(--text-faint); font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }
    .empty { color: var(--text-dim); font-size: 0.9rem; }

    /* ── Calling ───────────────────────────────────────────────────────────── */
    #ringing {
      display: flex; align-items: center; gap: 0.6rem;
      margin-bottom: 0.9rem; padding: 0.7rem 0.9rem;
      background: var(--amber-bg); border-left: 3px solid var(--amber);
      border-radius: 8px;
    }
    #ringingwho { flex: 1; font-weight: 500; }
    #ringing button { padding: 0.35rem 0.75rem; font-size: 0.85rem; }
    #ringing .accept { background: var(--green); }
    #ringing .reject { background: var(--red); }

    #callarea {
      margin-bottom: 0.9rem; padding: 0.75rem;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    #videos { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    #callarea video {
      width: 100%; aspect-ratio: 4 / 3; object-fit: cover;
      background: #000; border-radius: 8px;
    }
    #callinfo {
      font-size: 0.8rem; color: var(--text-dim); margin: 0.55rem 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #callarea .hangup { background: var(--red); padding: 0.35rem 0.8rem; font-size: 0.85rem; }

    /* ── Narrow screens ────────────────────────────────────────────────────── */
    /* The sidebar becomes a strip above the conversation rather than disappearing
       behind a hamburger: room switching and the online list are the two things
       you actually need on a phone, and a menu you have to open hides both. */
    @media (max-width: 760px) {
      #shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      #sidebar {
        flex-direction: row; flex-wrap: wrap; align-items: center;
        gap: 0.6rem; border-right: 0; border-bottom: 1px solid var(--border);
      }
      #sidebar .side-label, #sidebar .spacer, #newroom { display: none; }
      #rooms { flex-direction: row; flex-wrap: wrap; }
      #onlinenames { flex-direction: row; flex-wrap: wrap; gap: 0.6rem; }
      #topbar input { width: 100%; }
      .msg { max-width: 88%; }
      #videos { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Login view -->
  <div id="login">
    <div class="brand">chat-go</div>
    <div class="tagline">Real-time chat, semantic search and calling.</div>
    <input id="username" placeholder="username" autocomplete="username">
    <input id="password" type="password" placeholder="password" autocomplete="current-password">
    <button onclick="login()">Sign in</button>
    <p id="error"></p>
  </div>

  <!-- Chat view (hidden until logged in).
       #chat is what the script shows and hides with an inline style; #shell
       inside it is what does the layout. Keeping those two jobs on separate
       elements is why an inline `display: block` cannot flatten the grid.

       The inline `display: none` is the INITIAL state, and it has to be an inline
       style rather than the hidden attribute — the script reveals this element with
       `style.display = 'block'`, and [hidden] is !important above, so a hidden
       attribute here could never be undone.

       Without it nothing hid this element on first paint: the script only ever sets
       display in RESPONSE to an event, so before anyone logs in the entire shell
       rendered directly underneath the login card. -->
  <div id="chat" style="display: none">
   <div id="shell">

    <aside id="sidebar">
      <div class="brand">chat-go</div>

      <div>
        <!-- One button per room. Filled from GET /rooms, which also says which
             ones we are already a member of. -->
        <div class="side-label">Rooms</div>
        <div id="rooms"></div>
      </div>

      <div class="row" id="newroom">
        <input id="roomname" placeholder="new room" autocomplete="off">
        <button onclick="createRoom()">Create</button>
      </div>

      <div>
        <!-- Who's online. Filled from GET /rooms/{id}/presence, which reads
             Redis — so it shows people connected to the OTHER gateway too. -->
        <div class="side-label">Online</div>
        <div id="onlinenames"><span class="empty">nobody yet</span></div>
      </div>

      <div class="spacer"></div>

      <!-- Forces every call through the TURN relay, so the relay path can be
           tested and measured without needing a network hostile enough to make
           a direct connection fail on its own. -->
      <label id="relaytoggle"><input type="checkbox" id="forcerelay"> force relay (TURN only)</label>
      <button id="signout" onclick="signOut()">Sign out</button>
    </aside>

    <main id="main">
      <header id="topbar">
        <span id="roomtitle">general</span>
        <span class="grow"></span>
        <!-- Semantic search: finds messages by MEANING, not by keyword. In the
             header because it searches the room you are looking at. -->
        <input id="q" placeholder="search by meaning…" autocomplete="off"
               onkeydown="if(event.key==='Enter')search()">
        <button onclick="search()">Search</button>
        <button id="catchup" onclick="catchup()" title="Summarise what you missed">Catch me up</button>
      </header>

      <div id="scroll">
        <!-- Somebody is calling us. Hidden until an offer arrives. -->
        <div id="ringing" hidden>
          <span id="ringingwho"></span>
          <button class="accept" onclick="acceptCall()">Accept</button>
          <button class="reject" onclick="rejectCall()">Reject</button>
        </div>

        <!-- The call itself. `muted` on the local video stops you hearing
             yourself through your own speakers, which the mic then picks up. -->
        <div id="callarea" hidden>
          <div id="videos">
            <video id="localvideo" autoplay muted playsinline></video>
            <video id="remotevideo" autoplay playsinline></video>
          </div>
          <div id="callinfo"></div>
          <button class="hangup" onclick="hangUp()">Hang up</button>
        </div>

        <!-- Streaming summary lands here, a fragment at a time. Doubles as the
             error panel — see #summary.error in the stylesheet. -->
        <div id="summary"></div>

        <div id="results"></div>

        <div id="messages"></div>
      </div>

      <div id="composer">
        <input id="input" placeholder="type a message and hit Enter…" autocomplete="off">
        <button onclick="send()">Send</button>
      </div>
    </main>

   </div>
  </div>

  <script>
    // Which room we're currently in. Remembered across refreshes so reloading
    // doesn't dump you back in room 1 — falls back to 1 the first time.
    let room = Number(localStorage.getItem('chat_room')) || 1;
    let ws;                 // will hold the open WebSocket once we're connected
    let presenceTimer;      // the periodic online-list refresh

    function token() { return localStorage.getItem('chat_token'); }
    function authHeader() { return { 'Authorization': 'Bearer ' + token() }; }

    // ── WebRTC calling ───────────────────────────────────────────────────────
    //
    // Where to find STUN and TURN comes FROM THE SERVER, at /ice-config.
    //
    // It used to be a constant here. The relay runs on demand on a cheap cloud
    // instance and gets a new public address every time it starts, so hardcoding
    // it meant editing this file and rebuilding the binary after every start.
    //
    // This value is only a fallback for the moment before the fetch lands — STUN
    // alone, so a call attempted in that window still works on a friendly network.
    let iceServers = [{ urls: ['stun:stun.l.google.com:19302'] }];

    async function refreshIceConfig() {
      if (!token()) return;
      try {
        const res = await fetch('/ice-config', { headers: authHeader() });
        if (!res.ok) return;
        const cfg = await res.json();
        if (cfg.iceServers && cfg.iceServers.length) {
          iceServers = cfg.iceServers;
          console.log('ice config', iceServers.map((s) => s.urls).flat());
        }
      } catch (e) {
        // Keep the fallback. A call on a friendly network still works without it.
      }
    }

    let pc = null;             // the live connection, if there is one
    // callBusy is `pc` for the window where pc does not exist yet.
    //
    // startCall and acceptCall both `await getMedia()` before assigning pc, and
    // that await can last many seconds — it is the camera permission prompt. A
    // guard of `if (pc)` therefore answers "no" for the whole time a call is
    // being set up, so a second path can start setting up another one, and
    // whichever finishes second silently OVERWRITES pc.
    //
    // That produced "InvalidStateError: cannot create an answer in a state other
    // than have-remote-offer": acceptCall set a remote offer on its connection,
    // startCall's getMedia then resolved and replaced pc with one holding a
    // LOCAL offer, and acceptCall's next line called createAnswer on it.
    //
    // This flag is set SYNCHRONOUSLY, before any await, which is the whole
    // point — it closes the window the real guard cannot see. Same shape as the
    // orphaned pump in internal/hub: a check whose answer is invalidated by the
    // await that follows it.
    let callBusy = false;
    let localStream = null;    // our camera and microphone
    let peerId = 0;            // who we are on a call with
    let peerName = '';
    let pendingOffer = null;   // an incoming offer waiting for Accept
    let pendingIce = [];       // candidates that arrived before we had a remote description
    let onlineById = {};       // id -> username, so an incoming call has a name
    let statsTimer = null;     // repeatedly samples the connection while a call is up
    let connectTimer = null;   // gives up on a call that never establishes
    let rttSamples = [];       // every round-trip reading for this call

    // Video is CONSTRAINED, not left to the camera's preference.
    //
    // Unconstrained, getUserMedia hands back whatever the camera likes — often
    // 720p or 1080p at 30fps. A consumer uplink, and a mobile one especially,
    // cannot carry that, so packets queue somewhere along the path. Queuing is
    // what latency feels like. 640x360 at 24fps is a sane budget for a call
    // between two ordinary connections.
    //
    // `ideal` rather than `exact` on purpose: exact makes getUserMedia FAIL on a
    // camera that cannot hit the number, whereas ideal asks for the closest it
    // can manage. A slightly wrong resolution beats no video at all.
    const VIDEO_CONSTRAINTS = {
      width: { ideal: 640 },
      height: { ideal: 360 },
      frameRate: { ideal: 24, max: 30 },
    };

    // Reads the uid claim out of the JWT we are already holding.
    //
    // This is NOT verification — the server checks the signature on every single
    // request and never trusts anything the browser says. We only need to know
    // which of the online people is us, so we don't draw a "call yourself" button.
    function myUserId() {
      const t = token();
      if (!t) return 0;
      try { return JSON.parse(atob(t.split('.')[1])).uid || 0; } catch (e) { return 0; }
    }

    function sendSignal(to, kind, data) {
      if (!ws) return;
      ws.send(JSON.stringify({ type: 'signal', to, kind, data }));
    }

    function callStatus(text) {
      document.getElementById('callinfo').textContent = text;
    }

    async function getMedia() {
      if (localStream) return localStream;
      // Browsers refuse this on plain http:// — localhost is the only exception.
      // That is why the two-real-networks test needs HTTPS.
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: VIDEO_CONSTRAINTS, audio: true });
      } catch (e) {
        // A camera that is missing, blocked, or already held by another
        // application should not mean no call at all — audio alone is still a
        // call. Ask again without video before giving up.
        //
        // Found the honest way: on one machine with one webcam, the SECOND
        // browser genuinely cannot open it (NotReadableError, "could not start
        // video source"), because plenty of Windows camera drivers are
        // exclusive-access and Chrome cannot share across instances.
        console.warn('video unavailable, falling back to audio:', e.name, e.message);
        localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
        showError('camera unavailable (' + e.name + ') — audio only');
      }
      document.getElementById('localvideo').srcObject = localStream;
      return localStream;
    }

    // whyNot turns "it didn't connect" into a sentence that points at one thing.
    //
    // Relay-only has four distinct failures and they need four different fixes,
    // but from the outside they are one symptom: a connection that sits on
    // "connecting" until the timer fires. This used to report the first of them
    // unconditionally, which cost me a debugging session — the message said no
    // TURN server was configured while /ice-config was plainly serving one, and
    // the real fault was a mistyped shared secret.
    function whyNot(policy, relayCandidates, iceError) {
      if (policy !== 'relay') return ' — no usable network path between you two';

      // urls is a string OR an array per the spec, hence the concat.
      const haveTurn = iceServers.some((s) =>
        [].concat(s.urls).some((u) => u.indexOf('turn:') === 0));

      if (!haveTurn) return ' — relay was forced, and no TURN server is configured';
      if (iceError) return ' — the TURN server refused us (' + iceError + ')';
      if (!relayCandidates) return ' — the TURN server never replied; check it is running and its port is open';
      return ' — the relay gave us an address, but the two sides still could not reach each other';
    }

    // newPeerConnection wires up the three things that matter: our candidates
    // going out, their media coming in, and the moment it connects or gives up.
    function newPeerConnection(otherId) {
      // iceTransportPolicy 'relay' makes the browser DISCARD every non-relay
      // candidate — it pretends a direct path is impossible. That is how the TURN
      // path gets tested deterministically from an ordinary desk, instead of
      // hunting for a hostile enough network to trigger it naturally. It is also
      // how the relay's latency cost gets measured against the direct figure.
      const policy = document.getElementById('forcerelay').checked ? 'relay' : 'all';
      if (policy === 'relay') console.log('forcing relay-only ICE');
      const c = new RTCPeerConnection({ iceServers, iceTransportPolicy: policy });

      // Per-connection evidence, filled in by the two handlers below and read
      // by the give-up timer. Scoped to this connection rather than the page so
      // a second call never inherits the first one's diagnosis.
      let relayCandidates = 0;
      let iceError = '';

      // Give up after 20 seconds rather than sitting on "connecting…" forever.
      //
      // ICE has no reason to fail quickly — it waits out its own timers before
      // declaring failure, which is well over half a minute of a call looking
      // like it might still work. Worst case is relay-only with no TURN server
      // configured: the browser gathers ZERO candidates, so there is nothing to
      // try and nothing to time out, and the state never moves at all.
      clearTimeout(connectTimer);
      connectTimer = setTimeout(() => {
        if (pc === c && c.connectionState !== 'connected') {
          showError('call did not connect' + whyNot(policy, relayCandidates, iceError));
          endCall();
        }
      }, 20000);

      // Trickle ICE: addresses are discovered over a second or two and sent as
      // each one appears, rather than waiting for the complete list. Waiting
      // would add that delay to the start of every call.
      c.onicecandidate = (e) => {
        if (!e.candidate) return;
        // A 'relay' candidate is an address the TURN server allocated FOR us.
        // Getting one is proof the relay was reached AND accepted our
        // credential; getting none under relay-only policy is the whole
        // failure, and is otherwise completely silent.
        if (e.candidate.type === 'relay') relayCandidates++;
        sendSignal(otherId, 'ice', e.candidate.toJSON());
      };

      // onicecandidateerror is the ONLY place the browser says why a server was
      // unusable. 401 means the relay was reached and rejected our credential —
      // a secret mismatch, not a network problem. Without this, "wrong secret"
      // and "port blocked" look identical from the browser: both are just a
      // connection that never leaves "connecting".
      c.onicecandidateerror = (e) => {
        if (!e.url || e.url.indexOf('turn:') !== 0) return; // STUN chatter, not ours
        iceError = e.errorCode + (e.errorText ? ' ' + e.errorText : '');
        console.warn('ICE server error', e.url, iceError);
      };

      c.ontrack = (e) => {
        document.getElementById('remotevideo').srcObject = e.streams[0];
      };

      c.onconnectionstatechange = () => {
        if (c.connectionState === 'connected') {
          clearTimeout(connectTimer);   // it made it; stop the giving-up clock
          // Deliberately NOT writing a status line here first. reportPath is
          // about to write the ICE path, which is the number this whole phase
          // exists to produce — and this handler can fire more than once, so a
          // plain "connected" would overwrite the measurement moments after it
          // appeared. Observed exactly that on one side of the first call.
          reportPath(c);
          // And keep sampling, so the line shows how the link behaves over the
          // call rather than how it looked in its first half-second.
          clearInterval(statsTimer);
          statsTimer = setInterval(() => reportPath(c), 3000);
          return;
        }
        callStatus('connection: ' + c.connectionState);
        if (c.connectionState === 'failed' || c.connectionState === 'closed') endCall();
      };
      return c;
    }

    // reportPath asks the browser WHICH ROUTE the media actually took. This is
    // the measurement the whole phase exists for:
    //
    //   host   both ends on the same network, no NAT in the way
    //   srflx  through NAT, address discovered via STUN, still peer-to-peer
    //   relay  a direct path was impossible, so everything goes via TURN
    //
    // On one laptop this will always say host <-> host. That proves the plumbing
    // and measures nothing — the number only becomes real once one side is
    // genuinely on a different network.
    async function reportPath(c) {
      const stats = await c.getStats();
      let pair = null;
      stats.forEach((r) => {
        if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.nominated) pair = r;
      });
      if (!pair) return;

      const local = stats.get(pair.localCandidateId);
      const remote = stats.get(pair.remoteCandidateId);
      const path = (local ? local.candidateType : '?') + ' <-> ' + (remote ? remote.candidateType : '?');

      // Round-trip time is SAMPLED REPEATEDLY, not read once.
      //
      // A single reading taken the instant the connection reports "connected" is
      // close to meaningless: ICE has only just finished its checks and that
      // first figure carries setup cost. Measured on one call it gave 47ms, and
      // on the next 658ms — same devices, same networks. One sample cannot tell
      // a bad link from a bad moment, so we keep them all and show the spread.
      let line = 'via ' + path;
      if (pair.currentRoundTripTime) {
        rttSamples.push(Math.round(pair.currentRoundTripTime * 1000));
        const last = rttSamples[rttSamples.length - 1];
        const min = Math.min(...rttSamples);
        const max = Math.max(...rttSamples);
        line += '  rtt ' + last + 'ms  (min ' + min + ' / max ' + max + ', n=' + rttSamples.length + ')';
      }
      callStatus(line);
      console.log('ICE', path, 'rtt', pair.currentRoundTripTime, pair);
    }

    async function startCall(otherId, otherName) {
      // callBusy, not just pc — see the note where it is declared. Set before
      // the first await, so acceptCall cannot slip in behind the camera prompt.
      if (pc || callBusy) { callStatus('already on a call'); return; }
      callBusy = true;
      peerId = otherId;
      peerName = otherName;
      document.getElementById('callarea').hidden = false;
      callStatus('calling ' + otherName + '…');
      try {
        const stream = await getMedia();
        pc = newPeerConnection(otherId);
        stream.getTracks().forEach((t) => pc.addTrack(t, stream));
        await pc.setLocalDescription(await pc.createOffer());
        sendSignal(otherId, 'offer', { type: pc.localDescription.type, sdp: pc.localDescription.sdp });
      } catch (e) {
        // showError, NOT callStatus. callStatus writes into the call area, and
        // endCall() hides that box a line later — so the explanation vanished
        // exactly when it was needed. The error panel outlives the call.
        console.error('startCall failed', e);
        showError('could not start the call: ' + e.name + ' — ' + e.message);
        endCall();
      }
    }

    function onOffer(fromId, sdp) {
      if (pc || callBusy) {
        // Already busy — including "placing a call right now but still waiting
        // on the camera prompt", which is what callBusy adds and what `pc`
        // alone could not see. Tell them rather than leaving them ringing
        // forever. If we both pressed call at the same moment, both offers get
        // declined and both people try again: no worse than a busy signal, and
        // far better than two half-built connections fighting over one variable.
        sendSignal(fromId, 'hangup', {});
        return;
      }
      pendingOffer = { fromId, sdp };
      document.getElementById('ringingwho').textContent =
        (onlineById[fromId] || ('user ' + fromId)) + ' is calling…';
      document.getElementById('ringing').hidden = false;
    }

    async function acceptCall() {
      if (!pendingOffer || pc || callBusy) return;
      callBusy = true;          // before the getMedia await, same reason as startCall
      const { fromId, sdp } = pendingOffer;
      pendingOffer = null;
      document.getElementById('ringing').hidden = true;

      peerId = fromId;
      peerName = onlineById[fromId] || ('user ' + fromId);
      document.getElementById('callarea').hidden = false;
      callStatus('connecting to ' + peerName + '…');
      try {
        const stream = await getMedia();
        pc = newPeerConnection(fromId);
        stream.getTracks().forEach((t) => pc.addTrack(t, stream));
        await pc.setRemoteDescription(new RTCSessionDescription(sdp));
        await drainPendingIce();
        await pc.setLocalDescription(await pc.createAnswer());
        sendSignal(fromId, 'answer', { type: pc.localDescription.type, sdp: pc.localDescription.sdp });
      } catch (e) {
        console.error('acceptCall failed', e);
        showError('could not answer: ' + e.name + ' — ' + e.message);
        endCall();
      }
    }

    function rejectCall() {
      if (!pendingOffer) return;
      sendSignal(pendingOffer.fromId, 'hangup', {});
      pendingOffer = null;
      pendingIce = [];
      document.getElementById('ringing').hidden = true;
    }

    async function onAnswer(sdp) {
      if (!pc) return;
      await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      await drainPendingIce();
    }

    // Candidates can arrive BEFORE the offer or answer they belong to. They are
    // sent the instant each is discovered, and nothing promises they overtake the
    // description in transit. Adding one with no remote description set throws,
    // so they queue until there is one.
    //
    // This is the classic trickle-ICE bug, and it is nasty because it hides: on a
    // fast local network the description almost always wins the race, so calls
    // work in testing and fail as soon as there is real latency.
    async function onIce(candidate) {
      if (!pc || !pc.remoteDescription) { pendingIce.push(candidate); return; }
      try { await pc.addIceCandidate(candidate); } catch (e) { console.warn('ice', e); }
    }

    async function drainPendingIce() {
      for (const c of pendingIce) {
        try { await pc.addIceCandidate(c); } catch (e) { console.warn('queued ice', e); }
      }
      pendingIce = [];
    }

    function hangUp() {
      if (peerId) sendSignal(peerId, 'hangup', {});
      endCall();
    }

    // endCall always stops the camera and microphone.
    //
    // Forgetting that leaves the camera light on after the call has ended, which
    // people notice and are right to find alarming. Closing the RTCPeerConnection
    // does NOT release the devices — the tracks are ours, not its.
    function endCall() {
      clearInterval(statsTimer);
      statsTimer = null;
      clearTimeout(connectTimer);
      connectTimer = null;
      if (rttSamples.length) {
        // Printed once at the end, because this is the actual result of the call
        // and the status line is about to disappear with the call area.
        console.log('call rtt summary (ms):', rttSamples,
          'min', Math.min(...rttSamples), 'max', Math.max(...rttSamples));
      }
      rttSamples = [];
      if (pc) {
        pc.onicecandidate = null;
        pc.ontrack = null;
        pc.onconnectionstatechange = null;
        pc.close();
        pc = null;
      }
      pendingIce = [];
      pendingOffer = null;
      // Cleared LAST among the call-state flags and unconditionally, including
      // on the error paths — startCall and acceptCall both call endCall() when
      // they throw. A callBusy left stuck true would refuse every subsequent
      // call with "already on a call" and look exactly like a hung connection.
      callBusy = false;
      peerId = 0;
      peerName = '';
      if (localStream) {
        localStream.getTracks().forEach((t) => t.stop());
        localStream = null;
      }
      document.getElementById('localvideo').srcObject = null;
      document.getElementById('remotevideo').srcObject = null;
      document.getElementById('callarea').hidden = true;
      document.getElementById('ringing').hidden = true;
    }

    function handleSignal(from, kind, data) {
      switch (kind) {
        case 'offer':  onOffer(from, data); break;
        case 'answer': onAnswer(data); break;
        case 'ice':    onIce(data); break;
        case 'hangup': callStatus('call ended'); endCall(); break;
      }
    }

    // ── Rooms ────────────────────────────────────────────────────────────────
    // Draws one button per room. The server tells us which ones we're a member
    // of, so a room we haven't joined can look different — clicking it joins us.
    async function refreshRooms() {
      if (!token()) return;
      const res = await fetch('/rooms', { headers: authHeader() });
      if (!res.ok) return;
      const rooms = await res.json();

      const bar = document.getElementById('rooms');
      bar.textContent = '';                    // rebuild rather than diff — it's a handful of buttons
      for (const r of rooms) {
        const b = document.createElement('button');
        b.textContent = r.name;                // textContent, so a room named "<b>" can't inject markup
        if (r.id === room) {
          b.className = 'current';
          // The header names the room you are actually reading. Set here rather
          // than in switchRoom, because this is the one place that knows a room
          // id's NAME — switchRoom only ever sees the id.
          document.getElementById('roomtitle').textContent = r.name;
        }
        else if (!r.member) b.className = 'guest';
        b.onclick = () => switchRoom(r.id);
        bar.appendChild(b);
      }
    }

    // switchRoom moves us to another room. Reconnecting is the whole mechanism:
    // a socket belongs to exactly one room on the server, so changing rooms means
    // a new socket. connect() already clears the message list and resets
    // presence, which is what stops the old room's content bleeding into the new
    // one.
    async function switchRoom(id) {
      if (id === room) return;                 // already here; don't churn the socket
      room = id;
      localStorage.setItem('chat_room', String(id));
      await connect(token());
    }

    // createRoom makes a room and drops you straight into it. The server adds the
    // creator as a member automatically, so no separate join is needed.
    async function createRoom() {
      const input = document.getElementById('roomname');
      const name = input.value.trim();
      if (!name || !token()) return;

      const res = await fetch('/rooms', {
        method: 'POST',
        headers: { ...authHeader(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      if (!res.ok) return;
      const created = await res.json();
      input.value = '';
      await switchRoom(created.id);
    }

    // showRoomless drops into the chat view with NO room open.
    //
    // A fresh install has no rooms, so there is nothing to join. Leaving the
    // login form up would blame the wrong thing — the account is fine; what's
    // missing is a room, and the box for creating one lives inside the chat
    // view. So show the view, open no socket, and say what to do next.
    //
    // `room = 0` is load-bearing, not tidiness. switchRoom() opens with
    // `if (id === room) return;` to avoid churning the socket needlessly, and
    // the first room ever created gets id 1 — which is exactly the value `room`
    // would still be holding. Parking it on an id no room can have is what
    // makes the next createRoom() actually connect instead of silently
    // returning and leaving the page looking broken.
    function showRoomless() {
      room = 0;
      document.getElementById('login').style.display = 'none';
      document.getElementById('chat').style.display = 'block';
      refreshRooms();
      showError('no rooms yet — type a name above and press Create to start one');
    }

    // ── Sign out ─────────────────────────────────────────────────────────────
    // Forgets the token here and closes the socket. It does NOT revoke anything:
    // the token stays valid on the server until it expires, so a copy of it would
    // still work. That's a convenience button, not a security control — see I2 in
    // docs/HARDENING.md for the real fix (short-lived tokens + a revocation list).
    function signOut() {
      if (ws) {
        ws.onclose = null;                     // don't let the close handler fight us
        ws.close();
        ws = null;
      }
      clearInterval(presenceTimer);
      endCall();                      // and definitely release the camera
      localStorage.removeItem('chat_token');
      localStorage.removeItem('chat_room');
      document.getElementById('messages').textContent = '';
      setOnlineEmpty('nobody yet');
      document.getElementById('rooms').textContent = '';
      document.getElementById('summary').style.display = 'none';
      document.getElementById('chat').style.display = 'none';
      document.getElementById('login').style.display = 'block';
    }

    // ── Who's online ─────────────────────────────────────────────────────────
    // Reads the list from the server, which reads it from Redis — so this shows
    // people connected to the OTHER gateway too, not just ours.
    async function refreshPresence() {
      if (!token()) return;
      try {
        const res = await fetch('/rooms/' + room + '/presence', { headers: authHeader() });
        // Not ok usually means 503: presence is down but chat is fine. Leave the
        // last known list on screen rather than blanking it — a stale list is
        // more useful than an empty one, and the next attempt may well succeed.
        if (!res.ok) return;
        const { online } = await res.json();

        // Rebuilt rather than diffed — it's a handful of names, and a diff would
        // be more code than it saves.
        onlineById = {};
        const me = myUserId();
        const box = document.getElementById('onlinenames');
        box.textContent = '';
        if (!online.length) { box.textContent = 'nobody'; return; }

        for (const u of online) {
          onlineById[u.id] = u.username;
          const span = document.createElement('span');
          span.className = 'person';
          span.textContent = u.username;   // textContent, so a username can't inject markup
          if (u.id !== me) {
            const b = document.createElement('button');
            b.className = 'callbtn';
            b.textContent = 'call';
            b.onclick = () => startCall(u.id, u.username);
            span.appendChild(b);
          }
          box.appendChild(span);
        }
      } catch (e) {
        // Network blip. Same reasoning: keep what we have and try again later.
      }
    }

    // On page load: if a token from a previous session is still saved, skip the
    // login form and reconnect. THIS is what stops a refresh from logging you
    // out — the token now outlives the page instead of dying with it.
    window.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('chat_token');
      if (token) connect(token);
    });

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // POST /login to get a JWT.
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if (!res.ok) {
        document.getElementById('error').textContent = 'login failed';
        return;
      }
      // Destructured to `tok` so it doesn't shadow the token() helper.
      const { token: tok } = await res.json();
      localStorage.setItem('chat_token', tok);   // remember it across refreshes
      connect(tok);
    }

    // connect turns a token into a live chat session: join the room, open the
    // WebSocket, swap to the chat view. Shared by a fresh login AND the
    // auto-reconnect on load, so the logic lives in exactly one place.
    // `tok`, not `token` — there is a token() helper above and a parameter of the
    // same name would shadow it inside this whole function.
    async function connect(tok) {
      // Tear down any previous socket FIRST.
      //
      // connect() has two callers — the DOMContentLoaded auto-reconnect and
      // login() — so it can run twice in one page life. Reassigning `ws` without
      // closing the old one leaves that socket open with its own onmessage
      // handler still attached, and every message then renders twice. It also
      // costs the server a second hub member for a client that only exists once.
      //
      // onclose is cleared before closing so the OLD socket's handler doesn't
      // fire and bounce us back to the login form mid-reconnect.
      if (ws) {
        ws.onclose = null;
        ws.close();
        ws = null;
      }
      clearInterval(presenceTimer);   // or reconnecting stacks a second timer

      // A call belongs to the room it started in, and signalling only reaches
      // members of that room — so leaving strands the other side. End it here
      // rather than leaving a dead video box and a live camera on screen.
      endCall();

      // The server replays the last 50 messages on EVERY connect, so start from
      // an empty list — otherwise a reconnect appends a second copy of history
      // on top of the one already on screen.
      document.getElementById('messages').textContent = '';

      // The online list belongs to the room we're LEAVING, so clear it too.
      // Without this, switching rooms briefly shows the old room's members as if
      // they were in the new one.
      setOnlineEmpty('nobody yet');

      // Work out which room to open BEFORE trying to join one.
      //
      // `room` comes from localStorage and falls back to 1 — and 1 is a GUESS.
      // It happened to hold on every database this had ever run against, because
      // room 1 has existed since phase 1, so this path never executed. On a
      // genuinely fresh install there are no rooms at all: the join below 404s,
      // the socket never opens, and the page sits on the login form with no way
      // forward except curl. Deploying to an empty cluster is what finally ran it.
      const roomsRes = await fetch('/rooms', { headers: { 'Authorization': 'Bearer ' + tok } });
      if (roomsRes.ok) {
        const rooms = await roomsRes.json();
        if (rooms.length === 0) {
          showRoomless();
          return;
        }
        // A remembered room can also be gone, or belong to a different
        // deployment's database — this browser's localStorage survives across
        // both. Falling back to the first room beats failing, and beats asking.
        if (!rooms.some(r => r.id === room)) {
          room = rooms[0].id;
          localStorage.setItem('chat_room', String(room));
        }
      }

      // Make sure we're a member of the room (idempotent — safe to repeat). This
      // is also what makes clicking an unjoined room work: the click switches to
      // it, and this joins us on the way in.
      await fetch('/rooms/' + room + '/join', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + tok },
      });

      // Trade the JWT for a single-use ticket BEFORE opening the socket.
      //
      // The token cannot ride in the socket URL. Query strings are written to
      // every access log on the path, and a JWT is a working credential for 24
      // hours — the gateway's own log used to contain complete, valid tokens.
      //
      // This request carries it in an Authorization header, like every other
      // fetch on the page, and gets back something opaque that is worth nothing
      // 30 seconds later and nothing at all once used. See internal/wsticket.
      const ticketRes = await fetch('/ws-ticket', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + tok },
      });
      if (!ticketRes.ok) {
        // 401 means the saved token has expired — bin it and show the login
        // form, the same thing ws.onclose does for a rejected token. Anything
        // else is Redis being unreachable, which is not the user's problem to
        // solve and not a reason to make them log in again.
        if (ticketRes.status === 401) {
          localStorage.removeItem('chat_token');
          document.getElementById('login').style.display = 'block';
          document.getElementById('chat').style.display = 'none';
          return;
        }
        showError('could not start a session — the server is having trouble, try again');
        return;
      }
      const { ticket } = await ticketRes.json();

      // Open the WebSocket — ticket + room ride in the query string.
      let opened = false;
      // Derive the socket scheme from the page's, never hardcode it. Over HTTPS a
      // browser BLOCKS a plain ws:// connection as mixed content — the page loads
      // fine and the socket silently never opens, which is a miserable thing to
      // debug. https -> wss, http -> ws.
      const wsScheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
      // The ticket needs no encoding: the server mints it with base64
      // RawURLEncoding, whose alphabet is already query-string safe.
      ws = new WebSocket(`${wsScheme}//${location.host}/ws?ticket=${ticket}&room=${room}`);

      ws.onopen = () => {
        opened = true;
        document.getElementById('login').style.display = 'none';
        document.getElementById('chat').style.display = 'block';
        document.getElementById('input').focus();

        // Redraw the room bar so the new room is the highlighted one, and so a
        // room we just joined stops looking like one we haven't.
        refreshRooms();
        refreshPresence();
        refreshIceConfig();   // before anyone can press a call button
        // A timer as well as the live nudges, because somebody TIMING OUT
        // produces no event at all — nobody announces their own crash. This is
        // what eventually removes them from the list.
        clearInterval(presenceTimer);
        presenceTimer = setInterval(refreshPresence, 20000);
      };

      // Every frame from the server carries a "type". Dispatch on it rather than
      // guessing from which fields are present.
      ws.onmessage = (event) => {
        const frame = JSON.parse(event.data);
        switch (frame.type) {
          case 'message': {
            const { username, body, sent_at } = frame.message;
            addMessage(username, body, sent_at);
            break;
          }
          case 'summary.chunk':
            appendSummary(frame.text);
            break;
          case 'summary.done':
            awaitingFirstChunk = false;
            break;
          case 'signal':
            handleSignal(frame.from, frame.kind, frame.signal);
            break;
          case 'presence':
            // The server only says "it changed", never what it changed to, so
            // there is one source of truth for the list instead of two that can
            // disagree. Go and ask.
            refreshPresence();
            break;
          case 'error':
            showError(frame.text);
            awaitingFirstChunk = false;
            break;
          default:
            // Unknown types are ignored, not treated as errors — that's what lets
            // the server add new frame kinds without breaking an older page.
            break;
        }
      };

      ws.onclose = () => {
        // Never got in => the token was almost certainly rejected (expired or
        // invalid): drop it and fall back to the login form. If we HAD opened,
        // this is just a mid-session drop — leave the token; a refresh reconnects.
        if (!opened) {
          localStorage.removeItem('chat_token');
          document.getElementById('login').style.display = 'block';
          document.getElementById('chat').style.display = 'none';
        }
      };
    }

    function send() {
      const input = document.getElementById('input');
      if (!input.value || !ws) return;

      // A slash command is a request to the GATEWAY, not a message to the room.
      // The server already knows that — it intercepts "/catchup" instead of
      // publishing it. The browser has to agree, or it fires the command off
      // without preparing anywhere to put the answer, and the reply streams into
      // a hidden panel. Same normalisation as the server's EqualFold/TrimSpace:
      // both ends must agree on what counts as the command.
      if (input.value.trim().toLowerCase() === '/catchup') {
        input.value = '';
        catchup();
        return;
      }

      ws.send(input.value);   // send raw text; the server tags it with our username
      input.value = '';
    }

    // The online list's empty state.
    //
    // A function rather than `textContent = '...'` because the placeholder needs
    // the .empty class to look like an absence instead of like a person — and
    // assigning textContent would wipe the element's children, class and all.
    function setOnlineEmpty(text) {
      const box = document.getElementById('onlinenames');
      box.textContent = '';
      const span = document.createElement('span');
      span.className = 'empty';
      span.textContent = text;
      box.appendChild(span);
    }

    // Who am I, for deciding which messages are mine.
    //
    // Read out of the JWT rather than kept as a second variable: the token is
    // already the authority on who you are, and a separate copy is a thing that
    // can disagree with it after a sign-out or a token swap. Memoised on the
    // token string, so switching accounts invalidates it for free.
    //
    // DISPLAY ONLY. This decodes the payload without verifying the signature,
    // which is fine for choosing a bubble colour and would be a hole for
    // anything else — the server never trusts a claim this function returns.
    let _nameCache = { token: '', name: '' };
    function myUsername() {
      const t = localStorage.getItem('chat_token') || '';
      if (t !== _nameCache.token) {
        let name = '';
        try {
          // base64url -> base64 before atob: JWTs use - and _ where base64
          // uses + and /, and atob rejects the former.
          const payload = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
          name = JSON.parse(atob(payload)).username || '';
        } catch (e) {
          name = '';   // malformed token: nothing is "mine", which is the safe default
        }
        _nameCache = { token: t, name };
      }
      return _nameCache.name;
    }

    function addMessage(username, body, sentAt) {
      const messages = document.getElementById('messages');

      const div = document.createElement('div');
      div.className = 'msg' + (username === myUsername() ? ' own' : '');

      // Name and time on their own line above the text, so a long message does
      // not push the timestamp somewhere unreadable.
      const meta = document.createElement('div');
      meta.className = 'meta';
      const b = document.createElement('b');
      b.textContent = username;                    // textContent = safe against HTML injection
      const time = document.createElement('span');
      time.className = 'time';
      // Server sends UTC; the browser renders it in the viewer's own timezone.
      time.textContent = new Date(sentAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      meta.appendChild(b);
      meta.appendChild(time);

      const text = document.createElement('div');
      text.textContent = body;                     // again textContent, never innerHTML

      div.appendChild(meta);
      div.appendChild(text);
      messages.appendChild(div);

      // The SCROLLING element is #scroll now, not #messages — #messages is a
      // plain flex column inside it. Scrolling the wrong one silently does
      // nothing, and the symptom is just "new messages don't come into view".
      const scroll = document.getElementById('scroll');
      scroll.scrollTop = scroll.scrollHeight;
    }

    // ── Catch me up (streaming summary) ──────────────────────────────────────
    // True from the moment we ask for a summary until the first fragment lands —
    // that's the window where the placeholder is showing and must be cleared.
    let awaitingFirstChunk = false;

    function catchup() {
      if (!ws) return;
      showSummary('Summarising…', true);
      awaitingFirstChunk = true;
      // Sent as an ordinary socket message; the gateway recognises the slash
      // command and handles it instead of publishing it to the room.
      ws.send('/catchup');
    }

    function showSummary(text, waiting) {
      const panel = document.getElementById('summary');
      panel.style.display = 'block';
      panel.classList.toggle('waiting', !!waiting);
      panel.classList.remove('error');   // a new summary must not stay tinted red
      panel.textContent = text;
    }

    // Errors share the panel but never share its look. The server sends these when a
    // send only half-succeeded — delivered but not saved, saved but not delivered, or
    // neither — so they must not be mistakable for a summary.
    function showError(text) {
      const panel = document.getElementById('summary');
      panel.style.display = 'block';
      panel.classList.remove('waiting');
      panel.classList.add('error');
      panel.textContent = text;
    }

    function appendSummary(text) {
      const panel = document.getElementById('summary');
      panel.classList.remove('error');   // ditto, coming the other way
      // A chunk arriving is itself proof the panel is needed, so unhide it here
      // rather than relying on whoever triggered the summary to have done it.
      // Visibility that depends on the SENDER remembering to prepare the RECEIVER
      // breaks the moment a new trigger is added — which is exactly how the typed
      // "/catchup" ended up streaming into an invisible div.
      panel.style.display = 'block';
      // The first chunk replaces the "Summarising…" placeholder; every chunk after
      // it appends. That's what makes the answer visibly assemble itself.
      if (awaitingFirstChunk) {
        panel.classList.remove('waiting');
        panel.textContent = '';
        awaitingFirstChunk = false;
      }
      panel.textContent += text;   // += on textContent stays XSS-safe
    }

    // ── Semantic search ──────────────────────────────────────────────────────
    async function search() {
      const q = document.getElementById('q').value.trim();
      const results = document.getElementById('results');
      if (!q) return;

      results.innerHTML = '';
      const pending = document.createElement('p');
      pending.className = 'empty';
      pending.textContent = 'searching…';   // the embedding call takes a moment
      results.appendChild(pending);

      // encodeURIComponent escapes spaces, &, ? etc. Without it, a query like
      // "a & b" would be parsed as a second query parameter and silently truncated.
      // Searches the room you're currently IN, not room 1. Message embeddings are
      // per room, so searching the wrong one silently returns nothing.
      const res = await fetch(`/rooms/${room}/search?q=${encodeURIComponent(q)}`, {
        headers: authHeader(),
      });

      results.innerHTML = '';
      if (!res.ok) {
        showEmpty(res.status === 503
          ? 'search is unavailable — the embedding service is down'
          : 'search failed');
        return;
      }

      const { indexed, results: hits } = await res.json();
      if (!hits.length) {
        // `indexed` is why the server bothers returning a count: no results with
        // an empty index is a totally different problem from no results with a
        // full one, and the user deserves to know which.
        showEmpty(indexed === 0
          ? 'nothing indexed yet — is the indexer running?'
          : `no close matches among ${indexed} indexed messages`);
        return;
      }

      for (const hit of hits) {
        const div = document.createElement('div');
        div.className = 'hit';

        // Similarity as a percentage, right-aligned.
        const score = document.createElement('span');
        score.className = 'score';
        score.textContent = Math.round(hit.similarity * 100) + '%';
        div.appendChild(score);

        const b = document.createElement('b');
        b.textContent = hit.username;          // textContent, not innerHTML — XSS-safe
        div.appendChild(b);
        div.appendChild(document.createTextNode(': ' + hit.body));
        results.appendChild(div);
      }
    }

    function showEmpty(text) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = text;
      document.getElementById('results').appendChild(p);
    }

    // Press Enter in the message box to send.
    document.getElementById('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') send();
    });

    // Press Enter in the search box to search.
    document.getElementById('q').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') search();
    });
  </script>
</body>
</html>
