# Load balancer in front of the chat-go gateways — Phase 6.1.
#
# It holds no application code and no application state. Its entire job is to
# give the gateway processes ONE address, so clients stop picking a port by
# hand and so a gateway can be added, removed, or restarted without anybody
# changing a bookmark.

# nginx requires an events block even when nothing in it is customised.
events {}

http {
    # The backend pool. Default balancing is round-robin: request 1 -> 8090,
    # request 2 -> 8091, request 3 -> 8090, and so on.
    #
    # There is deliberately NO sticky-session directive here. Every gateway can
    # serve every request because nothing lives in a gateway's memory: identity
    # is a signed JWT (verified by recomputing the signature, never looked up),
    # room membership and history are in Postgres, and live fan-out is Redis
    # pub/sub. The only thing a gateway holds is the open socket itself, and a
    # TCP connection cannot move between processes anyway.
    #
    # host.docker.internal = "the machine running Docker". Needed because the
    # gateways run on the host under `go run`, not inside this network.
    upstream chat_gateways {
        server host.docker.internal:8090;
        server host.docker.internal:8091;
    }

    # `Connection` must say "upgrade" for a WebSocket handshake and "close" for
    # an ordinary request, so it cannot be hardcoded. This computes it from what
    # the client actually sent: $http_upgrade is the client's Upgrade header,
    # which is empty on a normal page load.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8088;

        location / {
            proxy_pass http://chat_gateways;

            # nginx speaks HTTP/1.0 to backends by default, and the Upgrade
            # mechanism only exists in HTTP/1.1. Without this the gateway never
            # sees a valid handshake and answers as though it were a plain GET,
            # so the WebSocket never opens.
            proxy_http_version 1.1;

            # Upgrade and Connection are HOP-BY-HOP headers: they describe a
            # single leg of the journey, so the HTTP spec requires a proxy to
            # strip them rather than pass them on. nginx is correct to remove
            # them — which means we have to deliberately re-issue them on the
            # second leg, or the handshake dies here instead of reaching Go.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # End-to-end headers. Without these the gateway's access log would
            # record every client as nginx's own container IP.
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Default is 60s of silence from the backend before nginx closes the
            # connection. A quiet chat room sends nothing for minutes and a
            # WebSocket is supposed to survive that, so push it well past any
            # plausible idle gap. Gateway logs already show sockets living 15+
            # minutes; at the default they would all have been cut at 60s.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
