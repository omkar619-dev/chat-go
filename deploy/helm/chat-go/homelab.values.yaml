# Values for the homelab cluster — single-node k3s on the New PC.
#
#   helm upgrade chat-go deploy/helm/chat-go -f deploy/helm/chat-go/homelab.values.yaml
#
# Committed deliberately: nothing in here is secret. It describes WHERE this
# deployment lives, not what it knows. The credentials arrive separately, from
# deploy/sealed/homelab.yaml, which is the whole point of secrets.create=false.
#
# This file exists because the same three --set flags were being retyped on
# every upgrade, and a flag you retype is a flag you eventually mistype.

image:
  # Pulled from the registry CI publishes to, instead of being built by hand on
  # the node and side-loaded with `docker save | k3s ctr images import`. That
  # worked, but it meant the running code existed only on that one machine and
  # nothing recorded which commit produced it.
  repository: ghcr.io/omkar619-dev/chat-go

  # An IMMUTABLE tag, deliberately — not `main`.
  #
  # `main` moves with every push, so two nodes pulling it an hour apart can run
  # different code while both reporting the same tag, and a rollback means
  # rebuilding rather than re-pointing. A sha tag names exactly one build
  # forever, which means this line answers "what is deployed" with something you
  # can `git checkout`.
  #
  # Updating it is a COMMIT, and that is the feature: the repository becomes the
  # record of what is running, with history and a rollback that is just a revert.
  # Automating the bump is what ArgoCD Image Updater does; doing it by hand a few
  # times first is how you find out what it is automating.
  tag: sha-a6b48b6

  # IfNotPresent is CORRECT here precisely because the tag is immutable: the same
  # tag can never mean different bytes, so a cached copy is never stale. With a
  # mutable tag like `main` this setting would be a bug — nodes would keep
  # serving whatever they happened to pull first.
  pullPolicy: IfNotPresent

monitoring:
  # The Prometheus Operator CRDs exist on this cluster (kube-prometheus-stack,
  # release "kps" in the monitoring namespace), so the ServiceMonitor and
  # PrometheusRule can be rendered here. They stay off on k3d, where there is no
  # operator and the kinds do not exist.
  enabled: true
  # kube-prometheus-stack adopts only PrometheusRules carrying its own release
  # label. Naming it here beats disabling the selector cluster-wide, which would
  # make Prometheus adopt every rule anyone ever applied.
  extraLabels:
    release: kps

secrets:
  # The Secret named <release>-secrets is NOT created by this chart. It is
  # produced by the SealedSecret controller decrypting deploy/sealed/homelab.yaml,
  # and it must exist BEFORE this chart is applied — Helm cannot express that
  # dependency, because the thing depended on is no longer Helm's. See B5 in
  # docs/HARDENING.md for how that went wrong the first time.
  create: false

ingress:
  enabled: true

  # The node's Tailscale MagicDNS name, not its LAN address.
  #
  # 192.168.29.51 is a DHCP lease. The Old PC's lease moved four times and took
  # kubectl, Ollama and an ArgoCD application down with it each time. A tailnet
  # name is assigned for the life of the node and never moves.
  host: omkarhomelabnewpc.tail24646b.ts.net

  # A genuine Let's Encrypt certificate, issued by Tailscale for the *.ts.net
  # name — no domain purchase, no public exposure. Created out of band:
  #
  #   sudo tailscale cert omkarhomelabnewpc.tail24646b.ts.net
  #   kubectl create secret tls chat-go-tls --cert=<...>.crt --key=<...>.key
  #
  # ⚠️ IT EXPIRES IN ABOUT 90 DAYS AND NOTHING RENEWS IT. Copying a certificate
  # into a Secret takes a snapshot; re-run both commands before it lapses, or
  # adopt the Tailscale Kubernetes operator, which owns the lifecycle properly.
  tlsSecretName: chat-go-tls

ollama:
  # Ollama now runs on THIS node, not the Old PC. It moved because the Old PC is
  # awaiting repair, and it stays because a Ryzen 3100 beats a Core 2 Duo even
  # without GPU offload, and all-minilm is 23M parameters — trivial on CPU.
  #
  # The node's own LAN address: pods route to their node directly, and Ollama is
  # bound to 0.0.0.0 by a systemd drop-in at
  # /etc/systemd/system/ollama.service.d/override.conf (a drop-in, not
  # `systemctl set-environment`, so it survives package upgrades and reboots).
  #
  # ⚠️ This is a DHCP lease. The Old PC's moved four times and broke kubectl,
  # Ollama and an ArgoCD app on each occasion — put a reservation on this MAC.
  # The tailnet address would be stable, but pod-to-tailnet routing is one more
  # thing to be wrong, and this one is verified working from inside a pod.
  url: http://192.168.29.51:11434

# The period with Ollama unreachable was not wasted: it is what the consumer-lag
# alert caught on its first day, with the indexer stuck at exactly 10 messages
# while its pod reported 1/1 Running and zero restarts. Worth remembering that
# the system degraded correctly throughout — /search returned "the embedding
# service is down", live chat was untouched — and that degrading correctly is
# exactly what made the failure invisible until something measured it.
