# Local data plane for chat-go — Phase 0.
# Kafka is intentionally NOT here yet; it arrives in Phase 2 when we produce to it.
services:
  postgres:
    image: pgvector/pgvector:0.7.4-pg16   # Postgres 16 with pgvector baked in (same family as news-feed)
    platform: linux/amd64
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat_dev
      POSTGRES_DB: chat
    ports:
      - "5433:5432"    # host 5433 -> dodges news-feed's 5432 and any native Postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"    # host 6381 -> dodges news-feed's 6380 and any native Redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka — the durable, replayable message log (Phase 2). Single-node KRaft
  # (no ZooKeeper). Host port 9094 dodges any local Kafka on 9092.
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Two "call-back numbers": INTERNAL for clients inside the docker network
      # (advertised as the service name `kafka`), EXTERNAL for host clients
      # (advertised as localhost:9094). Each client gets the one it can reach.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  pg_data:
  redis_data:
  kafka_data:
